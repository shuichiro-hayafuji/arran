openapi: 3.0.3
info:
  title: Spendable Today API
  version: 1.1.0
  description: 家計データをもとに支出判断を支援するAPI
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: profile
  - name: transactions
  - name: consultations
  - name: reviews
  - name: memories
paths:
  /consultation-requests/{request_id}:
    parameters:
      - in: path
        name: request_id
        required: true
        schema: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
    post:
      tags: [consultations]
      summary: Accept or retrieve an owner-scoped logical chat submission
      description: Same ID and normalized payload retrieves the receipt. Different payload or another active submission returns 409. Processing continues after HTTP disconnect, bounded by 28 seconds including preparation and saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequestInput' }
      responses:
        '202':
          description: Durable receipt, possibly already terminal on retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRequestReceipt' }
        '400': { description: Invalid input; no acceptance }
        '401': { description: Invalid or expired session }
        '404': { description: Consultation not owned by this user; no acceptance }
        '409': { description: Logical ID payload mismatch or active request }
        '503': { description: Service stopping; retain the logical ID and query after restart }
        '500': { description: Acceptance could not be confirmed; query using the same ID }
    get:
      tags: [consultations]
      summary: Read the exact saved result for this logical submission
      responses:
        '200':
          description: Receipt, with immutable saved result when completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRequestReceipt' }
        '401': { description: Invalid or expired session }
        '404': { description: No receipt owned by this user }
        '503': { description: Service stopping; retain the logical ID and query after restart }
        '500': { description: Result temporarily unavailable }
    delete:
      tags: [consultations]
      summary: Cancel before commit, or return the committed result
      description: Unknown IDs receive a cancelled tombstone and cannot later execute. Cancellation winning the save lock prevents financial changes. A completed request remains completed.
      responses:
        '200':
          description: Cancellation receipt or previously committed result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRequestReceipt' }
        '400': { description: Invalid logical ID }
        '401': { description: Invalid or expired session }
        '503': { description: Service stopping; retain the logical ID and query after restart }
        '500': { description: Cancellation not confirmed }
  /auth/login:
    post:
      security: []
      summary: Login using an account provisioned in the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 128 }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: A bearer session with a seven-day absolute expiry
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at, user]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/AuthUser' }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
        '429': { description: Rate limited. Retry after 60 seconds }
        '503': { description: Authentication database unavailable }
  /auth/me:
    get:
      summary: Return the authenticated user
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { description: Invalid or expired session }
        '503': { description: Authentication database unavailable }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
        '401': { description: Invalid or expired session }
        '503': { description: Session revocation unavailable }
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: Healthy }
  /healthz:
    get:
      security: []
      tags: [health]
      summary: ヘルスチェック
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /profile:
    get:
      tags: [profile]
      summary: プロフィール取得
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: プロフィール, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
    put:
      tags: [profile]
      summary: プロフィール更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 更新後のプロフィール, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /transactions/import/preview:
    post:
      tags: [transactions]
      summary: CSVインポートのプレビュー
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mapping: { type: string, description: JSON形式のCSVMapping。任意のtransaction_id_columnは利用者が選ぶ安定明細ID列 }
                reconciliation_decisions: { type: string, description: 'ReconciliationDecision JSON array; unresolved purchase identity prevents commit' }
                identity_decisions: { type: string, description: ImportIdentityDecisionのJSON配列。sameには候補snapshotが必要 }
                source: { type: string }
                source_account_name: { type: string }
                confirm_reactivation: { type: string, enum: ["true", "false"], description: 取消済み同IDの再有効化を明示確認 }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: プレビュー結果, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreview' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /transactions/import/commit:
    post:
      tags: [transactions]
      summary: CSVインポートを確定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_id]
              properties:
                preview_id: { type: string }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 登録結果, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCommitResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /transactions:
    get:
      tags: [transactions]
      summary: 取引明細一覧
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200':
          description: 明細一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                  categories: { type: array, items: { type: string } }
  /transactions/{id}:
    get:
      tags: [transactions]
      summary: 原銀行明細と有効な訂正投影
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: 所有者の明細, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [transactions]
      summary: 版付き金額・日付・カテゴリ訂正（銀行原内容を保持）
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/CSVMutationInput' }
                - type: object
                  required: [category]
                  not: { required: [mutation_id] }
                  properties:
                    category: { type: string }
                    remember_merchant: { type: boolean }
      responses:
        '200':
          description: mutation_id付きは保存結果、旧カテゴリのみは更新後取引
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/CSVMutationResult' }
                  - { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 状態版/明細版または同ID異payload競合 }
  /dashboard/monthly:
    get:
      tags: [transactions]
      summary: 月次ダッシュボード
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 月次集計, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /consultations:
    get:
      tags: [consultations]
      summary: 相談履歴一覧
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 相談一覧, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Consultation' } } } } } } }
    post:
      tags: [consultations]
      summary: チャットだけで支出相談を開始
      description: プロフィールとCSVは必須ではありません。モデル失敗時も相談と履歴を保存します。planned_amountは旧クライアント互換の補足情報です。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                planned_amount: { type: integer, format: int64, minimum: 0, nullable: true }
      responses:
        '409': { description: 保存中に会話または記憶が更新されたため再読込が必要 }
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '201': { description: 相談結果, content: { application/json: { schema: { $ref: '#/components/schemas/Consultation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /consultations/{id}:
    get:
      tags: [consultations]
      summary: 相談詳細
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 相談, content: { application/json: { schema: { $ref: '#/components/schemas/Consultation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /consultations/{id}/messages:
    post:
      tags: [consultations]
      summary: 同じ相談へ補足・訂正・再試行を送信
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                planned_amount: { type: integer, format: int64, minimum: 0, nullable: true }
      responses:
        '409': { description: 保存中に会話または記憶が更新されたため再読込が必要 }
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 更新後の相談, content: { application/json: { schema: { $ref: '#/components/schemas/Consultation' } } } }
  /consultations/{id}/result:
    patch:
      tags: [consultations]
      summary: 支出結果を記録
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationResultUpdate' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 更新後の相談, content: { application/json: { schema: { $ref: '#/components/schemas/Consultation' } } } }
  /reviews/monthly:
    post:
      tags: [reviews]
      summary: 月次レビュー作成
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '201': { description: 月次レビュー, content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyReview' } } } }
  /reviews/latest:
    get:
      tags: [reviews]
      summary: 最新レビュー取得
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 月次レビュー, content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyReview' } } } }
  /memories:
    get:
      tags: [memories]
      summary: 記憶一覧
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 記憶一覧, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MemoryItem' } } } } } } }
    post:
      tags: [memories]
      summary: 記憶を追加
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryItem' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '201': { description: 保存された記憶, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryItem' } } } }
  /memories/{id}:
    patch:
      tags: [memories]
      summary: 記憶を更新
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryItem' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '200': { description: 更新後の記憶, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryItem' } } } }
    delete:
      tags: [memories]
      summary: 記憶を削除
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '401': { description: Invalid or expired bearer session }
        '503': { description: Authentication database unavailable }
        '204': { description: 削除完了 }
  /expenses/count:
    get:
      tags: [transactions]
      summary: Owner integrated expense counts; existing dashboard amounts unchanged
      parameters:
        - { in: query, name: month, schema: { type: string }, description: YYYY-MM optional; undated and unresolved remain global }
      responses:
        '200':
          description: Dated and undated counts; estimated is a subset of confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCount' }
        '400': { description: Invalid month }
        '401': { description: Invalid or expired bearer session }
  /purchases/{id}/csv-candidates:
    get:
      tags: [consultations]
      summary: Owner scoped local CSV identity choices; at most 100 rows
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Candidate snapshots for explicit same or distinct
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReconciliationConflict' } }
        '404': { description: Unknown or forgotten purchase }
        '401': { description: Invalid or expired bearer session }
  /transactions/{id}/reconciliation:
    post:
      tags: [transactions]
      summary: Save explicit purchase identity; financial reflection occurs in next chat
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationDecision' }
      responses:
        '200': { description: Identity saved; financial_status pending_next_chat }
        '400': { description: Invalid or conflicting choice }
        '404': { description: Unknown owner scoped record }
        '409': { description: State or purchase snapshot changed }
        '401': { description: Invalid or expired bearer session }
  /purchases/{id}/csv-distinct:
    post:
      tags: [consultations]
      summary: Mark all current CSV candidates distinct from this purchase atomically
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationDecision' }
      responses:
        '200': { description: Identity saved; next chat may finish pending financial reflection }
        '400': { description: Invalid choice or candidate count exceeds 1000 }
        '404': { description: Unknown purchase }
        '409': { description: State or purchase snapshot changed }
        '401': { description: Invalid or expired bearer session }
  /imports:
    get:
      tags: [transactions]
      summary: 取込履歴（行・snapshot・取消影響はdetailを読む）
      parameters:
        - { name: before, in: query, schema: { type: string }, description: 前ページ末尾のid。日時/id順で最大20件 }
      responses:
        '200': { description: owner履歴, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CSVImportBatch' } } } } }
  /imports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [transactions]
      summary: 取込の原観測・現在投影・有効性・取消影響
      responses:
        '200': { description: owner取込, content: { application/json: { schema: { $ref: '#/components/schemas/CSVImportBatch' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/cancel-preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [transactions]
      summary: cancel-preview（本人の購入・銀行原記録を保持）
      responses:
        '200': { description: owner保存または確認結果, content: { application/json: { schema: { $ref: '#/components/schemas/CSVImportBatch' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 状態版/対象snapshotまたは同ID異payload競合 }
  /imports/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [transactions]
      summary: cancel（本人の購入・銀行原記録を保持）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CSVMutationInput' }
      responses:
        '200': { description: owner保存または確認結果, content: { application/json: { schema: { $ref: '#/components/schemas/CSVMutationResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 状態版/対象snapshotまたは同ID異payload競合 }
  /imports/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [transactions]
      summary: restore（本人の購入・銀行原記録を保持）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CSVMutationInput' }
      responses:
        '200': { description: owner保存または確認結果, content: { application/json: { schema: { $ref: '#/components/schemas/CSVMutationResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 状態版/対象snapshotまたは同ID異payload競合 }
  /mutations/{id}:
    get:
      tags: [transactions]
      summary: 同論理IDの保存結果照会
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: owner結果, content: { application/json: { schema: { $ref: '#/components/schemas/CSVMutationResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /changes/{id}:
    get:
      tags: [transactions]
      summary: 対象のimmutable監査
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: owner結果, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CSVChangeEvent' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 対象なし
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ChatRequestInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        consultation_id: { type: integer, format: int64, minimum: 0, default: 0 }
        message: { type: string, minLength: 1, description: Trimmed UTF-8 input plus optional amount sentence must be at most 16000 bytes }
        planned_amount: { type: integer, format: int64, minimum: 0, nullable: true }
    ChatRequestReceipt:
      type: object
      required: [request_id, status, expires_at, cancel_requested, error_code, result]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [processing, completed, cancelled, failed] }
        expires_at: { type: string, format: date-time }
        cancel_requested: { type: boolean }
        error_code: { type: string, description: Empty on success; failure reason on terminal failed or cancelled tombstone }
        result:
          allOf: [{ $ref: '#/components/schemas/Consultation' }]
          nullable: true

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    Profile:
      type: object
      properties:
        monthly_income: { type: integer, format: int64 }
        current_balance: { type: integer, format: int64 }
        monthly_fixed_costs: { type: integer, format: int64 }
        monthly_free_budget: { type: integer, format: int64 }
        monthly_savings_goal: { type: integer, format: int64 }
        reduce_categories: { type: array, items: { type: string } }
        allowed_categories: { type: array, items: { type: string } }
        long_term_goal: { type: string }
        advice_strictness: { type: string }
        updated_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, transaction_date, amount, transaction_type, category]
      properties:
        id: { type: integer, format: int64 }
        transaction_date: { type: string, format: date }
        description: { type: string }
        normalized_merchant: { type: string }
        amount: { type: integer, format: int64 }
        transaction_type: { type: string }
        category: { type: string }
        source: { type: string }
        source_account_name: { type: string }
        imported_at: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
    ImportIdentityDecision:
      type: object
      required: [row, action]
      properties:
        row: { type: integer, minimum: 2 }
        action: { type: string, enum: [same, distinct] }
        transaction_id: { type: integer, format: int64, description: sameの既存候補ID。distinctは0 }
        snapshot: { type: string, description: sameに必要な候補snapshot }
    ImportIdentityConflict:
      type: object
      required: [row, transaction, candidates, candidate_snapshots]
      properties:
        row: { type: integer }
        transaction: { $ref: '#/components/schemas/Transaction' }
        candidates: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        candidate_snapshots: { type: object, additionalProperties: { type: string }, description: 候補ID文字列からsnapshotへの対応 }
    CSVMapping:
      type: object
      properties:
        date_column: { type: string }
        description_column: { type: string }
        amount_column: { type: string }
        debit_column: { type: string }
        credit_column: { type: string }
        transaction_id_column: { type: string, description: 実在する安定明細ID列を明示指定。取込元/口座も必須 }
    ImportPreview:
      type: object
      properties:
        reactivation_ids: { type: array, items: { type: integer, format: int64 }, description: 未確認ならpreview_idは空 }
        reconciliation_conflicts: { type: array, items: { $ref: '#/components/schemas/ReconciliationConflict' } }
        identity_notice: { type: string }
        identity_conflicts: { type: array, items: { $ref: '#/components/schemas/ImportIdentityConflict' } }
        preview_id: { type: string, description: 未解決identity_conflictsがある場合は空で確定不可 }
        detected_encoding: { type: string }
        headers: { type: array, items: { type: string } }
        mapping: { $ref: '#/components/schemas/CSVMapping' }
        needs_mapping: { type: boolean }
        read_count: { type: integer }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        expense_total: { type: integer, format: int64 }
        rows: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        warnings: { type: array, items: { type: string } }
    ImportCommitResult:
      type: object
      properties:
        import_id: { type: string }
        reactivated_count: { type: integer }
        financial_pending: { type: integer, description: 復活方向の金融保留数。金融完了を意味しない }
        imported_count: { type: integer }
        duplicate_count: { type: integer }
    Dashboard:
      type: object
      properties:
        month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        expense_total: { type: integer, format: int64 }
        fixed_expense_estimate: { type: integer, format: int64 }
        free_expense_total: { type: integer, format: int64 }
        monthly_free_budget: { type: integer, format: int64 }
        free_budget_remaining: { type: integer, format: int64 }
        drinking_total: { type: integer, format: int64 }
        subscription_total: { type: integer, format: int64 }
        by_category: { type: array, items: { type: object } }
        recent_transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
    Consultation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        user_message: { type: string }
        planned_amount: { type: integer, format: int64, nullable: true }
        inferred_category: { type: string }
        ai_recommendation: { type: string }
        ai_reasoning_summary: { type: string }
        current_situation: { type: string }
        alternative: { type: string }
        final_question: { type: string }
        status: { type: string, description: 新しい相談はanswered・provisional・needs_information・unavailable。旧相談には旧ステータスが残ります。 }
        response_source: { type: string }
        needs_follow_up: { type: boolean }
        follow_up_question: { type: string }
        pending_purchase:
          type: object
          nullable: true
          description: LLMが抽出した商品と購入確認待ちの予定。金額の補足・訂正では商品を保持し、同額の商品変更は更新、明示的な取り消しは解除する。単一予定の互換表示。複数予定・実績・訂正はpurchasesを参照する。
          required: [description, amount, recorded_at, status]
          properties:
            description: { type: string }
            amount: { type: integer, format: int64 }
            recorded_at: { type: string, format: date-time }
            status: { type: string, enum: [purchase_confirmation_pending, needs_classification, classification_required] }
        purchases:
          type: array
          nullable: true
          description: 元の相談に紐づく複数の予定・確認時刻・実績・訂正イベント。IDで回答対象を区別する。
          items: { $ref: '#/components/schemas/Purchase' }
        messages:
          type: array
          nullable: true
          description: 保存した会話履歴。旧相談は空またはnull。
          items:
            type: object
            required: [role, content, created_at]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              reason: { type: string }
              assumptions: { type: string }
              created_at: { type: string, format: date-time }
    Purchase:
      type: object
      required: [id, consultation_id, description, amount, recorded_at, status, first_asked_at, second_asked_at, actual_amount, classification, balance_applied_amount, free_budget_applied_amount, events]
      properties:
        id: { type: string }
        consultation_id: { type: integer, format: int64 }
        description: { type: string }
        amount: { type: integer, format: int64 }
        recorded_at: { type: string, format: date-time }
        status: { type: string, enum: [purchase_confirmation_pending, needs_classification, classification_required, purchased, not_purchased, unanswered, cancelled] }
        first_asked_at: { type: string, description: 未確認は空文字 }
        second_asked_at: { type: string, description: 未確認は空文字 }
        purchase_date: { type: string, description: 'Explicit purchase date YYYY-MM-DD or empty; never consultation date' }
        actual_amount_basis: { type: string, enum: ['', reported, estimated] }
        csv_reconciliation_pending: { type: boolean }
        actual_amount: { type: integer, format: int64, nullable: true }
        balance_applied_amount: { type: integer, format: int64, nullable: true, description: 現在残高へ反映済みの実額。Goで計算する値ではない。 }
        free_budget_applied_amount: { type: integer, format: int64, nullable: true, description: 自由予算へ反映済みの実額。分類待ちは保留。 }
        classification: { type: string, enum: ['', free, necessary, unknown] }
        events:
          type: array
          nullable: true
          items:
            type: object
            required: [outcome, amount, classification, recorded_at, source]
            properties:
              outcome: { type: string, enum: [purchased, not_purchased, unanswered, needs_classification, classification_required] }
              amount: { type: integer, format: int64, nullable: true }
              classification: { type: string, enum: [free, necessary, unknown] }
              recorded_at: { type: string, format: date-time }
              source: { type: string }
              balance_applied_amount: { type: integer, format: int64, nullable: true }
              free_budget_applied_amount: { type: integer, format: int64, nullable: true }
              balance_basis: { type: string, description: purchase・user_report。旧イベントは空文字。 }
    ConsultationResultUpdate:
      type: object
      properties:
        status: { type: string, enum: [spent, skipped, reduced, pending] }
        actual_amount: { type: integer, format: int64, nullable: true }
        user_decision_reason: { type: string }
        satisfaction_score: { type: integer, minimum: 1, maximum: 5, nullable: true }
        regret_score: { type: integer, minimum: 1, maximum: 5, nullable: true }
        note: { type: string }
    ReviewCandidate:
      type: object
      properties:
        label: { type: string }
        judgement: { type: string }
        total_amount: { type: integer, format: int64 }
        count: { type: integer }
        reason: { type: string }
        annualized_amount: { type: integer, format: int64 }
        question: { type: string }
    MonthlyReview:
      type: object
      properties:
        id: { type: integer, format: int64 }
        month: { type: string }
        created_at: { type: string, format: date-time }
        summary: { type: string }
        candidates: { type: array, items: { $ref: '#/components/schemas/ReviewCandidate' } }
    MemoryItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        content: { type: string }
        evidence: { type: string }
        confidence: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReconciliationDecision:
      type: object
      required: [row, action, purchase_id, snapshot, state_version]
      properties:
        row: { type: integer }
        action: { type: string, enum: [same, distinct] }
        purchase_id: { type: string, description: Empty only for CSV preview distinct-all-purchases }
        snapshot: { type: string, description: Local purchase revision; not sent to LLM }
        state_version: { type: integer, format: int64 }
    ReconciliationCandidate:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        planned_amount: { type: integer, format: int64 }
        actual_amount: { type: integer, format: int64, nullable: true }
        status: { type: string }
        classification: { type: string }
        recorded_at: { type: string }
        purchase_date: { type: string }
        snapshot: { type: string }
    ReconciliationConflict:
      type: object
      properties:
        row: { type: integer }
        transaction: { $ref: '#/components/schemas/Transaction' }
        candidates: { type: array, items: { $ref: '#/components/schemas/ReconciliationCandidate' } }
        state_version: { type: integer, format: int64 }
    ExpenseCount:
      type: object
      properties:
        month: { type: string }
        confirmed: { type: integer, description: Dated expenses within optional month }
        estimated: { type: integer, description: Subset of confirmed; do not add }
        undated: { type: integer, description: Disjoint all-time undated expenses }
        unresolved: { type: integer, description: All-time unresolved identity or contradiction }
        pending_recalculation: { type: integer, description: All-time pending financial updates }
        scope: { type: string }
    TransactionRecord:
      type: object
      required: [original, current, active, state_version]
      properties:
        original: { $ref: '#/components/schemas/Transaction' }
        current: { $ref: '#/components/schemas/Transaction' }
        active: { type: boolean }
        state_version: { type: integer, format: int64 }
    CSVMutationInput:
      type: object
      required: [mutation_id, expected_version, state_version]
      properties:
        mutation_id: { type: string, maxLength: 128 }
        action: { type: string, enum: [correct, cancel, restore], description: API pathで指定。correctでは少なくとも1訂正項目が必要 }
        expected_version: { type: integer, format: int64 }
        state_version: { type: integer, format: int64 }
        snapshot: { type: string, description: cancel/restoreはdetail snapshot必須 }
        amount: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        transaction_date: { type: string, format: date }
        category: { type: string }
        remember_merchant: { type: boolean }
        reason: { type: string, maxLength: 2000 }
    CSVMutationResult:
      type: object
      required: [mutation_id, status, affected_count, protected_count, pending_recalculation, state_version]
      properties:
        mutation_id: { type: string }
        status: { type: string, enum: [saved] }
        affected_count: { type: integer }
        protected_count: { type: integer }
        pending_recalculation: { type: integer }
        state_version: { type: integer, format: int64 }
    CSVImportBatch:
      type: object
      properties:
        id: { type: string }
        file_key: { type: string, description: ローカル銀行identity。モデルへ送らない }
        source: { type: string }
        account: { type: string }
        metadata:
          type: object
          properties:
            file_name: { type: string }
            encoding: { type: string }
            mapping: { $ref: '#/components/schemas/CSVMapping' }
        status: { type: string, enum: [active, cancelled] }
        version: { type: integer, format: int64 }
        state_version: { type: integer, format: int64 }
        recorded_at: { type: string, description: 証明できない旧取込は空文字（日時不明） }
        legacy: { type: boolean }
        result: { $ref: '#/components/schemas/ImportCommitResult' }
        snapshot: { type: string, description: detailのowner/版/全行確認snapshot。履歴一覧では空 }
        cancel_affected_count: { type: integer, description: detailの取消影響。履歴一覧では0 }
        cancel_protected_count: { type: integer, description: detailの他active evidenceまたは旧不明証拠による保護数 }
        rows:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              transaction_id: { type: integer, format: int64 }
              original: { $ref: '#/components/schemas/Transaction' }
              current: { $ref: '#/components/schemas/Transaction' }
              active: { type: boolean }
              legacy_retained: { type: boolean }
    CSVChangeEvent:
      type: object
      properties:
        id: { type: string }
        mutation_id: { type: string }
        kind: { type: string }
        target: { type: string }
        recorded_at: { type: string, format: date-time }
        before_state: { type: string, description: 保存した監査JSON。モデルへ送らない }
        after_state: { type: string, description: 保存した監査JSON。financial_confirmationでは採用モードとaxisを含む }
    DataChangeContext:
      type: object
      description: 内部LLM送信契約。銀行identityは含めずpublic取込detailと混同しない
      additionalProperties: false
      required: [ref, operation, before, after, included_count, omitted_count, balance_resolved, budget_resolved, related_purchase_ids]
      properties:
        ref: { type: string }
        operation: { type: string, enum: [correct_expense, correct_income, cancel_expense, cancel_income, restore_expense, restore_income] }
        before: { type: array, items: { $ref: '#/components/schemas/FinancialTriplet' } }
        after: { type: array, items: { $ref: '#/components/schemas/FinancialTriplet' } }
        included_count: { type: integer }
        omitted_count: { type: integer }
        balance_resolved: { type: boolean }
        budget_resolved: { type: boolean }
        related_purchase_ids: { type: array, nullable: true, items: { type: string } }
    FinancialTriplet:
      type: object
      additionalProperties: false
      required: [date, amount, category]
      properties:
        date: { type: string, format: date }
        amount: { type: integer, format: int64 }
        category: { type: string }
    DataChangeUpdate:
      type: object
      additionalProperties: false
      required: [ref, status]
      properties:
        ref: { type: string }
        status: { type: string, enum: [applied, needs_information, baseline_adopted], description: baseline_adoptedは両basis=user_reportかつkind=factのsetと空またはJST現在月のperiodが必須。現在残高はJST現在日も許可 }
