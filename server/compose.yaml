services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: spendable_today
      POSTGRES_USER: spendable_today
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendable_today -d spendable_today"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - spendable-today-postgres:/var/lib/postgresql/data

volumes:
  spendable-today-postgres:
