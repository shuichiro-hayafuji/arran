group 'com.shuichirohayafuji.file_picker'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.shuichirohayafuji.file_picker'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
}

