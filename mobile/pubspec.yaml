name: spendable_today
description: A private Flutter MVP for AI-assisted spending decisions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0
  go_router: 12.1.1
  flutter_secure_storage: ^8.1.0
  dio: 5.4.3+1
  file_picker:
    path: packages/file_picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  freezed: ^3.2.0
  derry: ^1.5.0

flutter:
  uses-material-design: true

# Run with: fvm dart run derry <name>
scripts:
  run: fvm flutter run
  run-android: fvm flutter run --dart-define=API_BASE_URL=http://10.0.2.2:8080
  devices: fvm flutter devices
  get: fvm flutter pub get
  analyze: fvm flutter analyze
  test: fvm flutter test
  format: fvm dart format lib test
  generate: fvm dart run build_runner build --delete-conflicting-outputs
  watch: fvm dart run build_runner watch --delete-conflicting-outputs
  clean: fvm flutter clean
